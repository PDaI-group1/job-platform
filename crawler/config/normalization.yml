timezone: Europe/Helsinki

max_description_length: 50000

negation:
  window_chars: 25
  after_window_chars: 10
  words: ["ei", "eikä", "no", "not", "without", "ilman", "inte", "utan"]

remote_type:
  hybrid:
    - '^\s*hybrid\b'
    - '\bhybrid\s*$'
    - '\(\s*hybrid[^)]*\)'
    - '[-–|/,]\s*hybrid\b'
    - '\bhybrid[\s-]+(?:work\w*|role|position|model|setup|office)\b'
    - '\bhybridi(?:työ|työskentel|malli)\w*'
    - '\bosittai\w*\s+etä\w*'
    - '\betä-?\s*ja\s+lähityö\w*'
  remote:
    - '\b(100\s*%\s*)?etä(työ\w*|nä)\b'
    - '\bfully\s+remote\b'
    - '\bremote\b'
    - '\bdistans(arbete)?\b'
  onsite:
    - '\blähityö\w*'
    - '\bon[\s-]?site\b'
    - '\bpaikan\s+päällä\b'

remote_type_description:
  hybrid:
    - '\bhybrid[\s-]+(?:work\w*|role|position|model|setup|arrangement|schedule|office)\b'
    - '\bhybridi(?:työ|työskentel|malli(?:lla|ssa|n)?\b)\w*'
    - '\bosittai\w*\s+etä\w*'
    - '\betä-?\s*ja\s+lähityö\w*'
    - '\b(?:toimisto\w*|office|on[\s-]?site)\b.{0,120}\b(?:etä\w*|remote\w*)'
    - '\b(?:etä\w*|remote\w*)\b.{0,120}\b(?:toimisto\w*|office|on[\s-]?site)\b'
    - '\b(?:joustav\w*|flexib\w*)\b.{0,60}\b(?:etä\w*|remote\w*)'
    - '\b(?:etä\w*|remote\w*)\b.{0,60}\b(?:joustav\w*|flexib\w*)'
    - '\btapauskohtaisesti\b.{0,30}\betä\w*'
  remote:
    - '\b(?:fully|100\s*%|completely|entirely)\s+remote\b'
    - '\bremote[\s-]+(?:first|only|position|role|job)\b'
    - '\btäysin\s+etä\w*'
    - '\b100\s*%\s*etä\w*'
    - '\bhelt\s+på\s+distans\b'
  onsite:
    - '\blähityö\w*'
    - '\bon[\s-]?site\s+(?:role|position|job|work)\b'
    - '\bno\s+remote\s+work\b'

employment_type:
  internship:
    - '\bharjoittel\w*'
    - '\btrainee\w*'
    - '\binternship\w*'
    - '\bpraktik\w*'
  part_time:
    - '\bosa-?aikai\w*'
    - '\btuntityö\w*'
    - '\bpart[\s-]?time\b'
    - '\bdeltid\w*'
  temporary:
    - '\bmääräaikai\w*'
    - '\bsijai(nen|suu\w*)'
    - '\bkesätyö\w*'
    - '\bkeikkatyö\w*'
    - '\bfixed[\s-]?term\b'
    - '\btemporary\b'
    - '\bvisstid\w*'
  contract:
    - '\bfreelanc\w*'
    - '\btoimeksiant\w*'
    - '\bcontractor\b'
    - '\byrittäjä\w*'
  full_time:
    - '\bkokoaikai\w*'
    - '\bkokopäiväi\w*'
    - '\bfull[\s-]?time\b'
    - '\bheltid\w*'
    - '\bvakitui\w*'
    - '\bpermanent\b'

language:
  min_hits: 3
  stopwords:
    fi: ["ja", "on", "että", "sinä", "sinulla", "olet", "meillä", "työ", "tehtävä", "kanssa", "sekä", "myös", "tai", "joka", "voit"]
    en: ["and", "the", "you", "with", "our", "for", "are", "will", "your", "team", "we", "of", "to", "is"]
    sv: ["och", "att", "det", "som", "för", "med", "du", "vi", "är", "på", "av", "har", "inte"]


salary:
  default_currency: EUR
  periods:
    month: ['/\s*kk\b', '\bkk\b', 'kuukau\w*', '\bmonth\w*', '/\s*mo\b', 'kuukausipalk\w*', '\bmånad\w*']
    hour: ['/\s*h\b', '€\s*/\s*h', '\btunni\w*', '\btunti\w*', '\bhour\w*', '/\s*hr\b', '\btim(me|lön)\w*']
    year: ['/\s*v\b', '\bvuo(si|de)\w*', '\byear\w*', '\bannual\w*', '\bår\b']
  heuristic:
    hour_below: 100
    year_above: 15000

feed_filters:
  finland_pattern: '\b(Finland|Suomi|Helsin(ki|gfors)|Espoo|Esbo|Vantaa|Vanda|Kauniainen|Oulu|Uleåborg|Tampere|Tammerfors|Turku|Åbo|Jyväskylä|Kuopio|Lahti|Joensuu|Seinäjoki|Lappeenranta|Vaasa|Vasa|Pori|Kotka|Hämeenlinna|Rovaniemi|Uusimaa|Pirkanmaa|Etätyö)\b'
  skip_title_patterns:
    - '\bopen\s+applications?\b'
    - '\bgeneral\s+applications?\b'
    - '\bspontaneous\s+applications?\b'
    - '\bavoin\s+(työ)?hakemus\b'
    - '\bavoimet\s+hakemukset\b'
    - '\böppen\s+ansökan\b'
