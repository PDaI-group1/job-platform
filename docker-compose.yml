services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobplatform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobplatform-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobplatform-password}
      POSTGRES_DB: ${POSTGRES_DB:-jobplatform-db}
      SEED_DB: ${SEED_DB:-true}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./seeds:/seeds:ro
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
